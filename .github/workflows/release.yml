name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # Releases are always signed with the single release key from repo secrets:
      # SAYYARA_KEYSTORE_BASE64, SAYYARA_KEYSTORE_PASSWORD, SAYYARA_KEY_ALIAS, SAYYARA_KEY_PASSWORD.
      # No debug-key fallback, so every release can update the previous one.
      - name: Check signing secrets
        env:
          S1: ${{ secrets.SAYYARA_KEYSTORE_BASE64 }}
          S2: ${{ secrets.SAYYARA_KEYSTORE_PASSWORD }}
          S3: ${{ secrets.SAYYARA_KEY_ALIAS }}
          S4: ${{ secrets.SAYYARA_KEY_PASSWORD }}
        run: |
          missing=0
          for pair in "SAYYARA_KEYSTORE_BASE64:$S1" "SAYYARA_KEYSTORE_PASSWORD:$S2" "SAYYARA_KEY_ALIAS:$S3" "SAYYARA_KEY_PASSWORD:$S4"; do
            name="${pair%%:*}"; val="${pair#*:}"
            if [ -n "$val" ]; then echo "$name: present"; else echo "::error::$name is missing or empty"; missing=1; fi
          done
          exit $missing

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.SAYYARA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SAYYARA_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APKs
        env:
          SAYYARA_KEYSTORE_PASSWORD: ${{ secrets.SAYYARA_KEYSTORE_PASSWORD }}
          SAYYARA_KEY_ALIAS: ${{ secrets.SAYYARA_KEY_ALIAS }}
          SAYYARA_KEY_PASSWORD: ${{ secrets.SAYYARA_KEY_PASSWORD }}
        run: ./gradlew :core:jvmTest :app:assembleRelease :automotive:assembleRelease --console=plain

      - name: Collect APKs
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/*.apk "dist/sayyara-phone-$TAG.apk"
          cp automotive/build/outputs/apk/release/*.apk "dist/sayyara-automotive-$TAG.apk"
          ls -l dist

      - name: Verify signatures
        run: |
          for f in dist/*.apk; do
            echo "== $f"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$f" | grep -E "Signer #1 certificate (DN|SHA-256)"
          done
          for f in dist/*.apk; do
            if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$f" | grep -q "CN=Android Debug"; then
              echo "::error::$f is debug-signed"; exit 1
            fi
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Sayyara $TAG" --prerelease \
            --notes "Phone app (Android 8.0+, includes Android Auto) and Android Automotive OS build. Untested pre-release built from $GITHUB_SHA."
